<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="box">
        <div class="display"></div>

        <button class="delete" onclick="calculate('X')">X</button>
        <button class="reset" onclick="calculate('AC')">AC</button>
        <button class="percentage" onclick="calculate('%')">%</button>
        <button class="divide" onclick="calculate('/')">/</button>

        <button class="seven" onclick="calculate('7')">7</button>
        <button class="eight" onclick="calculate('8')">8</button>
        <button class="nine" onclick="calculate('9')">9</button>
        <button class="multiply" onclick="calculate('*')">X</button>

        <button class="four" onclick="calculate('4')">4</button>
        <button class="five" onclick="calculate('5')">5</button>
        <button class="six" onclick="calculate('6')">6</button>
        <button class="sub" onclick="calculate('-')">-</button>

        <button class="one" onclick="calculate('1')">1</button>
        <button class="two" onclick="calculate('2')">2</button>
        <button class="three" onclick="calculate('3')">3</button>
        <button class="add" onclick="calculate('+')">+</button>

        <button class="negate" onclick="calculate('+/-')">+/-</button>
        <button class="zero" onclick="calculate('0')">0</button>
        <button class="decimal" onclick="calculate('.')">.</button>
        <button class="equalTo" onclick="calculate('=')">=</button>

        <script src="script.js"></script>
    </div>
</body>

</html>
